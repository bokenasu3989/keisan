<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- スマホの画面幅に最適化し、入力時の自動ズームを防ぐ設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pococha 必要コイン計算ツール</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f0f2f5;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .container {
      width: 100%;
      max-width: 450px;
      background-color: #ffffff;
      padding: 24px 20px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    h1 {
      font-size: 1.25rem;
      color: #1a73e8;
      text-align: center;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid #e8f0fe;
    }

    .input-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 6px;
      color: #4a5568;
    }

    /* 入力欄・プルダウン */
    input[type="text"], select {
      width: 100%;
      height: 48px;
      padding: 0 12px;
      border: 1.5px solid #cbd5e0;
      border-radius: 8px;
      font-size: 16px; /* iOS自動ズーム防止のため16px以上 */
      background-color: #fff;
      color: #2d3748;
      outline: none;
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }

    input[type="text"]:focus, select:focus {
      border-color: #1a73e8;
    }

    .error-box {
      display: none;
      color: #e53e3e;
      background-color: #fff5f5;
      border: 1px solid #fed7d7;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 16px;
    }

    .result-card {
      margin-top: 20px;
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 0.95rem;
    }

    .result-main {
      background-color: #e8f0fe;
      padding: 12px;
      border-radius: 8px;
      margin: 12px 0;
    }

    .result-main .label {
      font-weight: bold;
      color: #1967d2;
      font-size: 1rem;
    }

    .result-main .value {
      font-size: 1.5rem;
      font-weight: 800;
      color: #d93025;
    }

    .item-count {
      font-weight: bold;
      color: #2d3748;
      font-size: 1.05rem;
    }

    hr {
      border: none;
      border-top: 1px solid #e2e8f0;
      margin: 12px 0;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Pococha 必要コイン計算</h1>

  <!-- 入力項目 (type="text" + inputmode="numeric" でカンマ変換と数値キーボードを両立) -->
  <div class="input-group">
    <label for="targetPt">想定pt</label>
    <input type="text" id="targetPt" inputmode="numeric" value="100,000" placeholder="例: 100,000">
  </div>

  <div class="input-group">
    <label for="currentPt">現在pt</label>
    <input type="text" id="currentPt" inputmode="numeric" value="50,000" placeholder="例: 50,000">
  </div>

  <div class="input-group">
    <label for="coreFansSelect">枠全体のコアファン数</label>
    <select id="coreFansSelect">
      <option value="1.00">0〜1人 (ボーナスなし / 100%)</option>
      <option value="1.01">2人 (101% / 1%UP)</option>
      <option value="1.02">5人 (102% / 2%UP)</option>
      <option value="1.03" selected>10人 (103% / 3%UP)</option>
      <option value="1.04">15人 (104% / 4%UP)</option>
      <option value="1.05">20人 (105% / 5%UP)</option>
      <option value="1.06">25人 (106% / 6%UP)</option>
      <option value="1.07">30人 (107% / 7%UP)</option>
      <option value="1.08">35人 (108% / 8%UP)</option>
      <option value="1.09">40人 (109% / 9%UP)</option>
      <option value="1.10">45人 (110% / 10%UP)</option>
      <option value="1.11">50人 (111% / 11%UP)</option>
      <option value="1.12">60人 (112% / 12%UP)</option>
      <option value="1.13">70人 (113% / 13%UP)</option>
      <option value="1.14">80人 (114% / 14%UP)</option>
      <option value="1.15">90人 (115% / 15%UP)</option>
      <option value="1.16">100人 (116% / 16%UP)</option>
      <option value="1.17">150人 (117% / 17%UP)</option>
      <option value="1.18">200人 (118% / 18%UP)</option>
      <option value="1.19">250人 (119% / 19%UP)</option>
      <option value="1.20">300人 (120% / 20%UP)</option>
      <option value="1.21">400人 (121% / 21%UP)</option>
      <option value="1.22">500人以上 (122% / 22%UP)</option>
    </select>
  </div>

  <!-- エラーメッセージ -->
  <div id="errorMessage" class="error-box"></div>

  <!-- 結果表示部分 -->
  <div class="result-card">
    <div class="result-row">
      <span>適用ボーナス</span>
      <span id="bonusRate" style="font-weight: bold;">-</span>
    </div>

    <div class="result-main">
      <div class="label">必要コイン数</div>
      <div><span id="resCoins" class="value">-</span> <span style="font-weight:bold;">コイン</span></div>
    </div>

    <hr>

    <div class="result-row">
      <span>馬車 (5,555コイン)</span>
      <span id="resCarriage" class="item-count">- 個</span>
    </div>

    <div class="result-row">
      <span>花火 (1,080コイン)</span>
      <span id="resFireworks" class="item-count">- 個</span>
    </div>
  </div>
</div>

<script>
  // カンマや全角数字を除去して数値に変換する関数
  function parseFormattedNumber(val) {
    if (!val) return NaN;
    // 全角数字を半角に変換し、カンマと空白を除去
    const cleanStr = val.replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xfee0))
                        .replace(/,/g, '')
                        .trim();
    return cleanStr === "" ? NaN : Number(cleanStr);
  }

  // 数値をカンマ区切り文字列にする関数
  function formatNumber(num) {
    if (isNaN(num)) return "";
    return num.toLocaleString();
  }

  function calculate() {
    const targetInputVal = document.getElementById("targetPt").value;
    const currentInputVal = document.getElementById("currentPt").value;
    const errorDiv = document.getElementById("errorMessage");

    errorDiv.style.display = "none";
    errorDiv.textContent = "";

    const targetPt = parseFormattedNumber(targetInputVal);
    const currentPt = parseFormattedNumber(currentInputVal);

    if (isNaN(targetPt) || isNaN(currentPt)) {
      showError("想定ptと現在ptを正しく入力してください。");
      resetResults();
      return;
    }

    if (targetPt < 0 || currentPt < 0) {
      showError("0以上の正しい数値を入力してください。");
      resetResults();
      return;
    }

    if (currentPt >= targetPt) {
      showError("現在ptが想定pt以上のため、目標を達成しています！");
      resetResults();
      return;
    }

    const bonusRate = Number(document.getElementById("coreFansSelect").value);
    const diffPt = targetPt - currentPt;

    // 計算（切り上げ）
    const neededCoins = Math.ceil(diffPt / (4 * bonusRate));
    const carriageCount = Math.ceil(neededCoins / 5555);
    const fireworksCount = Math.ceil(neededCoins / 1080);

    // 出力項目の表示更新（すべてカンマ区切り）
    document.getElementById("bonusRate").textContent = Math.round(bonusRate * 100) + "%";
    document.getElementById("resCoins").textContent = formatNumber(neededCoins);
    document.getElementById("resCarriage").textContent = formatNumber(carriageCount) + " 個";
    document.getElementById("resFireworks").textContent = formatNumber(fireworksCount) + " 個";
  }

  function showError(msg) {
    const errorDiv = document.getElementById("errorMessage");
    errorDiv.textContent = msg;
    errorDiv.style.display = "block";
  }

  function resetResults() {
    const bonusRate = Number(document.getElementById("coreFansSelect").value);
    document.getElementById("bonusRate").textContent = Math.round(bonusRate * 100) + "%";
    document.getElementById("resCoins").textContent = "0";
    document.getElementById("resCarriage").textContent = "0 個";
    document.getElementById("resFireworks").textContent = "0 個";
  }

  // 入力フォーカス時・解除時の処理を設定（入力中はカンマ外し、外れたらカンマ追加）
  function setupInputFormatting(elementId) {
    const inputEl = document.getElementById(elementId);

    // フォーカスが当たったらカンマを消して編集しやすくする
    inputEl.addEventListener("focus", function() {
      const num = parseFormattedNumber(this.value);
      this.value = isNaN(num) ? "" : num.toString();
    });

    // 入力中は即時計算
    inputEl.addEventListener("input", calculate);

    // フォーカスが外れたらカンマ区切りに整形
    inputEl.addEventListener("blur", function() {
      const num = parseFormattedNumber(this.value);
      if (!isNaN(num)) {
        this.value = formatNumber(num);
      }
      calculate();
    });
  }

  // イベント登録
  setupInputFormatting("targetPt");
  setupInputFormatting("currentPt");
  document.getElementById("coreFansSelect").addEventListener("change", calculate);

  // 初回計算
  calculate();
</script>

</body>
</html>
