<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pococha 計算ツール</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap');
    body { font-family: 'Noto Sans JP', sans-serif; background-color: #f1f5f9; }
  </style>
</head>
<body class="py-8 px-4 sm:px-6 lg:px-8 max-w-4xl mx-auto">

  <!-- ヘッダー -->
  <div class="bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 rounded-2xl p-6 text-white shadow-lg mb-6">
    <div class="flex items-center space-x-3 mb-2">
      <i class="fa-solid fa-calculator text-2xl text-yellow-300"></i>
      <h1 class="text-2xl font-bold">Pococha 計算ツール</h1>
    </div>
  </div>

  <!-- メインカード -->
  <div class="bg-white rounded-2xl shadow-md p-6 border border-slate-200 space-y-6">
    
    <!-- STEP 1: 条件選択 & 実測中央値参照 -->
    <div>
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">STEP 1 : 条件選択（実測参考値）</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
        
        <!-- 締め時間 -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">
            <i class="fa-regular fa-clock text-indigo-500 mr-1"></i>締め時間
          </label>
          <select id="timeSelect" onchange="onConditionChange()" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm font-bold text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            <option value="24" selected>24時締め</option>
            <option value="22">22時締め</option>
            <option value="13">13時締め</option>
          </select>
        </div>

        <!-- ランク -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">
            <i class="fa-solid fa-award text-indigo-500 mr-1"></i>現在のランク
          </label>
          <select id="rankSelect" onchange="onConditionChange()" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm font-bold text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            <optgroup label="Sランク">
              <option value="S6">S6</option>
              <option value="S5">S5</option>
              <option value="S4">S4</option>
              <option value="S3">S3</option>
              <option value="S2">S2</option>
              <option value="S1">S1</option>
            </optgroup>
            <optgroup label="Aランク">
              <option value="A3">A3</option>
              <option value="A2">A2</option>
              <option value="A1">A1</option>
            </optgroup>
            <optgroup label="Bランク">
              <option value="B3">B3</option>
              <option value="B2">B2</option>
              <option value="B1" selected>B1</option>
            </optgroup>
            <optgroup label="Cランク">
              <option value="C3">C3</option>
              <option value="C2">C2</option>
              <option value="C1">C1</option>
            </optgroup>
            <optgroup label="Dランク">
              <option value="D3">D3</option>
              <option value="D2">D2</option>
              <option value="D1">D1</option>
            </optgroup>
          </select>
        </div>

        <!-- 目標ボーダー -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">
            <i class="fa-solid fa-bullseye text-indigo-500 mr-1"></i>目標ボーダー
          </label>
          <select id="borderSelect" onchange="onConditionChange()" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm font-bold text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            <option value="±0" selected>プラマイ</option>
            <option value="+1">＋１</option>
            <option value="+2">＋２</option>
          </select>
        </div>

      </div>

      <!-- 実測参考値（中央値）表示パネル -->
      <div class="bg-slate-50 border border-slate-200 rounded-xl p-3.5">
        <div class="text-xs font-bold text-slate-500 mb-2 flex justify-between items-center">
          <span><i class="fa-solid fa-database text-indigo-500 mr-1"></i>ボーダー実測参考値</span>
        </div>
        <div class="grid grid-cols-3 gap-2 text-center">
          <div class="bg-white p-2 rounded border border-indigo-200">
            <div class="text-[10px] text-indigo-500 font-bold">中央</div>
            <div id="refMed" class="text-sm font-bold text-indigo-900">0</div>
          </div>
          <div class="bg-white p-2 rounded border border-red-200">
            <div class="text-[10px] text-red-400">最高</div>
            <div id="refMax" class="text-sm font-bold text-red-600">0</div>
          </div>
          <div class="bg-white p-2 rounded border border-emerald-200">
            <div class="text-[10px] text-emerald-500">最低</div>
            <div id="refMin" class="text-sm font-bold text-emerald-700">0</div>
          </div>
        </div>
      </div>
    </div>

    <hr class="border-slate-100">

    <!-- STEP 2: 入力3項目 -->
    <div>
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">STEP 2 : 計算データの入力（3項目）</h2>
      
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        
        <!-- 1. 想定pt -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="text-xs font-bold text-slate-700">
              <i class="fa-solid fa-flag-checkered text-indigo-600 mr-1"></i>想定pt
            </label>
            <div class="space-x-1">
              <button onclick="applyRef('med')" class="text-[10px] bg-indigo-100 hover:bg-indigo-200 text-indigo-800 px-1.5 py-0.5 rounded transition font-bold">中央</button>
              <button onclick="applyRef('max')" class="text-[10px] bg-red-100 hover:bg-red-200 text-red-800 px-1.5 py-0.5 rounded transition">最高</button>
              <button onclick="applyRef('min')" class="text-[10px] bg-emerald-100 hover:bg-emerald-200 text-emerald-800 px-1.5 py-0.5 rounded transition">最低</button>
            </div>
          </div>
          <div class="relative">
            <input type="text" id="targetPtInput" 
                   onfocus="onPtFocus(this)" onblur="onPtBlur(this)" oninput="calculate()" 
                   class="w-full text-base font-bold text-indigo-900 bg-indigo-50/40 border-2 border-indigo-200 rounded-xl py-2 pl-3 pr-8 focus:border-indigo-600 focus:outline-none">
            <span class="absolute right-2.5 top-1/2 -translate-y-1/2 text-xs font-bold text-indigo-400">pt</span>
          </div>
        </div>

        <!-- 2. 現在pt -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">
            <i class="fa-solid fa-play text-emerald-600 mr-1"></i>現在pt
          </label>
          <div class="relative">
            <input type="text" id="currentPtInput" value="80,000" 
                   onfocus="onPtFocus(this)" onblur="onPtBlur(this)" oninput="calculate()" 
                   class="w-full text-base font-bold text-emerald-900 bg-emerald-50/40 border-2 border-emerald-300 rounded-xl py-2 pl-3 pr-8 focus:border-emerald-600 focus:outline-none">
            <span class="absolute right-2.5 top-1/2 -translate-y-1/2 text-xs font-bold text-emerald-500">pt</span>
          </div>
        </div>

        <!-- 3. コアファン数 -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="text-xs font-bold text-slate-700">
              <i class="fa-solid fa-users text-pink-600 mr-1"></i>コアファン数
            </label>
            <span id="coreBonusBadge" class="text-[11px] font-bold text-pink-600 bg-pink-50 px-2 py-0.5 rounded-full border border-pink-200">
            </span>
          </div>
          <div class="relative">
            <select id="coreCountSelect" onchange="calculate()" 
                    class="w-full text-base font-bold text-pink-900 bg-pink-50/40 border-2 border-pink-300 rounded-xl py-2.5 pl-3 pr-8 focus:border-pink-600 focus:outline-none">
              <option value="0">0人 (+0%)</option>
              <option value="2">2人 (+1%)</option>
              <option value="5">5人 (+2%)</option>
              <option value="10">10人 (+3%)</option>
              <option value="15">15人 (+4%)</option>
              <option value="20" selected>20人 (+5%)</option>
              <option value="25">25人 (+6%)</option>
              <option value="30">30人 (+7%)</option>
              <option value="35">35人 (+8%)</option>
              <option value="40">40人 (+9%)</option>
              <option value="45">45人 (+10%)</option>
              <option value="50">50人 (+11%)</option>
              <option value="60">60人 (+12%)</option>
              <option value="70">70人 (+13%)</option>
              <option value="80">80人 (+14%)</option>
              <option value="90">90人 (+15%)</option>
              <option value="100">100人以上 (+16%)</option>
              <option value="150">150人以上 (+17%)</option>
              <option value="200">200人以上 (+18%)</option>
              <option value="250">250人以上 (+19%)</option>
              <option value="300">300人以上 (+20%)</option>
              <option value="350">350人以上 (+19%)</option>
              <option value="400">400人以上 (+20%)</option>
              <option value="450">450人以上 (+21%)</option>
              <option value="500">500人以上 (+22%)</option>
            </select>
          </div>
        </div>

      </div>
    </div>

    <!-- STEP 3: 出力3項目 -->
    <div id="resultCard" class="bg-gradient-to-br from-slate-900 via-indigo-950 to-purple-950 text-white rounded-2xl p-6 shadow-xl">
      <div class="text-xs font-bold text-indigo-300 uppercase tracking-wider mb-4 text-center">
        計算結果（すべて小数点切り上げ）
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        
        <!-- 出力1: 必要コイン数 -->
        <div class="bg-black/30 backdrop-blur-md rounded-xl p-4 border border-yellow-500/30 text-center">
          <div class="text-xs font-bold text-yellow-300 mb-1">
            <i class="fa-solid fa-coins text-yellow-400 mr-1"></i>必要コイン数
          </div>
          <div class="my-2">
            <span id="neededCoins" class="text-3xl font-black text-yellow-300">0</span>
            <span id="neededCoinsUnit" class="text-xs font-bold text-yellow-200 ml-1">コイン</span>
          </div>
        </div>

        <!-- 出力2: 馬車 -->
        <div class="bg-black/30 backdrop-blur-md rounded-xl p-4 border border-amber-500/30 text-center">
          <div class="text-xs font-bold text-amber-300 mb-1">
            <i class="fa-solid fa-horse-head text-amber-400 mr-1"></i>馬車
          </div>
          <div class="my-2">
            <span id="carriageCount" class="text-3xl font-black text-white">0</span>
            <span id="carriageCountUnit" class="text-xs font-bold text-amber-200 ml-1">台</span>
          </div>
        </div>

        <!-- 出力3: 花火 -->
        <div class="bg-black/30 backdrop-blur-md rounded-xl p-4 border border-pink-500/30 text-center">
          <div class="text-xs font-bold text-pink-300 mb-1">
            <i class="fa-solid fa-burst text-pink-400 mr-1"></i>花火
          </div>
          <div class="my-2">
            <span id="fireworkCount" class="text-3xl font-black text-white">0</span>
            <span id="fireworkCountUnit" class="text-xs font-bold text-pink-200 ml-1">発</span>
          </div>
        </div>

      </div>

      <div id="statusDetail" class="mt-4 text-center text-xs text-indigo-200 border-t border-white/10 pt-3">
        --
      </div>
    </div>

  </div>

        "C1": { "±0": { med: 24200,   max: 49400,   min: 13800 },  "+1": { med: 59000,   max: 118000,  min: 37000 },   "+2": { med: 101000,  max: 188000,  min: 64600 } },
        
        "D3": { "±0": { med: 9800,    max: 20400,   min: 5510 },   "+1": { med: 33500,   max: 64600,   min: 19900 },   "+2": { med: 54000,   max: 106000,  min: 32300 } },
        "D2": { "±0": { med: 4700,    max: 9980,    min: 2660 },   "+1": { med: 14500,   max: 29500,   min: 8360 },    "+2": { med: 24200,   max: 48500,   min: 14200 } },
        "D1": { "±0": { med: 2000,    max: 4560,    min: 1040 },   "+1": { med: 7100,    max: 14700,   min: 3700 },    "+2": { med: 13900,   max: 28300,   min: 8080 } }
      }
    };

    let currentRefStats = { med: 0, max: 0, min: 0 };

    // 画像に基づくコアボーナス倍率判定（厳密仕様）
    function getCoreBonusRate(count) {
      if (count >= 500) return 1.22;
      if (count >= 400) return 1.21;
      if (count >= 300) return 1.20;
      if (count >= 250) return 1.19;
      if (count >= 200) return 1.18;
      if (count >= 150) return 1.17;
      if (count >= 100) return 1.16;
      if (count >= 90)  return 1.15;
      if (count >= 80)  return 1.14;
      if (count >= 70)  return 1.13;
      if (count >= 60)  return 1.12;
      if (count >= 50)  return 1.11;
      if (count >= 45)  return 1.10;
      if (count >= 40)  return 1.09;
      if (count >= 35)  return 1.08;
      if (count >= 30)  return 1.07;
      if (count >= 25)  return 1.06;
      if (count >= 20)  return 1.05;
      if (count >= 15)  return 1.04;
      if (count >= 10)  return 1.03;
      if (count >= 5)   return 1.02;
      if (count >= 2)   return 1.01;
      return 1.00;
    }

    function formatPt(num) {
      return num.toLocaleString();
    }

    // 入力欄にフォーカスした時（カンマを外して編集しやすくする）
    function onPtFocus(input) {
      input.value = input.value.replace(/,/g, '');
    }

    // 入力欄からフォーカスが外れた時（カンマ区切りにする）
    function onPtBlur(input) {
      const val = parseInt(input.value.replace(/,/g, '')) || 0;
      input.value = val > 0 ? val.toLocaleString() : '';
      calculate();
    }

    // 条件変更時
    function onConditionChange() {
      const time = document.getElementById('timeSelect').value;
      const rank = document.getElementById('rankSelect').value;
      const border = document.getElementById('borderSelect').value;

      currentRefStats = statsData[time]?.[rank]?.[border] || { med: 0, max: 0, min: 0 };

      // 実測数値の表示更新（中央値・最高・最低）
      document.getElementById('refMed').innerText = formatPt(currentRefStats.med) + ' pt';
      document.getElementById('refMax').innerText = formatPt(currentRefStats.max) + ' pt';
      document.getElementById('refMin').innerText = formatPt(currentRefStats.min) + ' pt';

      // 初期値として「想定pt」に中央値をセット（カンマ付き）
      document.getElementById('targetPtInput').value = formatPt(currentRefStats.med);

      calculate();
    }

    // ワンタップで実測値を「想定pt」にセット
    function applyRef(type) {
      if (type === 'med') {
        document.getElementById('targetPtInput').value = formatPt(currentRefStats.med);
      } else if (type === 'max') {
        document.getElementById('targetPtInput').value = formatPt(currentRefStats.max);
      } else if (type === 'min') {
        document.getElementById('targetPtInput').value = formatPt(currentRefStats.min);
      }
      calculate();
    }

    // メイン計算処理
    function calculate() {
      // カンマを取り除いて数値に変換
      const targetRaw = document.getElementById('targetPtInput').value.replace(/,/g, '');
      const currentRaw = document.getElementById('currentPtInput').value.replace(/,/g, '');

      const targetPt = parseInt(targetRaw) || 0;
      const currentPt = parseInt(currentRaw) || 0;
      const coreCount = parseInt(document.getElementById('coreCountSelect').value) || 0;

      // コアボーナス取得
      const coreBonus = getCoreBonusRate(coreCount);
      const bonusPercentDisplay = Math.round(coreBonus * 100);
      const bonusUpDisplay = Math.round((coreBonus - 1) * 100);

      // コアボーナスバッジ更新
      document.getElementById('coreBonusBadge').innerText = `ボーナス: ${bonusPercentDisplay}% (+${bonusUpDisplay}%)`;

      const diffPt = targetPt - currentPt;

      if (diffPt <= 0) {
        // 必要コイン 表示
        document.getElementById('neededCoins').innerText = "到達済み！🎉";
        // 必要コイン 単位
        document.getElementById('neededCoinsUnit').style.display = "none";
        // 馬車 必要個数
        document.getElementById('carriageCount').innerText = "0";
        // 花火 必要個数
        document.getElementById('fireworkCount').innerText = "0";
        // 必要pt
        document.getElementById('statusDetail').style.display = "none";
        return;
      }

      // 式①: 必要コイン数 ＝ (想定pt - 現在pt) ÷ (4 × コアボーナス)  [切り上げ]
      const neededCoins = Math.ceil(diffPt / (4 * coreBonus));

      // 式②: 馬車 ＝ 必要コイン数 ÷ 5555  [切り上げ]
      const carriage = Math.ceil(neededCoins / 5555);

      // 式③: 花火 ＝ 必要コイン数 ÷ 1080  [切り上げ]
      const firework = Math.ceil(neededCoins / 1080);

      // 画面出力
      document.getElementById('neededCoins').innerText = formatPt(neededCoins);
      document.getElementById('neededCoinsUnit').style.display = "inline";
      document.getElementById('carriageCount').innerText = formatPt(carriage);
      document.getElementById('fireworkCount').innerText = formatPt(firework);
      document.getElementById('statusDetail').innerHTML = `あと <strong>${formatPt(diffPt)} pt</strong> 不足中`;
      document.getElementById('statusDetail').style.display = "block";
    }

    // 初回実行
    window.onload = function() {
      onConditionChange();
    };

    document.getElementById('targetPtInput').addEventListener('input', (e) => {
      // 全角数字 (０-９) を半角数字 (0-9) に変換
      e.target.value = e.target.value.replace(/[０-９]/g, (char) => String.fromCharCode(char.charCodeAt(0) - 0xFEE0));
    });

    document.getElementById('currentPtInput').addEventListener('input', (e) => {
      // 全角数字 (０-９) を半角数字 (0-9) に変換
      e.target.value = e.target.value.replace(/[０-９]/g, (char) => String.fromCharCode(char.charCodeAt(0) - 0xFEE0));
    });

  </script>
</body>
