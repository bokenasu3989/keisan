<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pococha メーター目標 & コアボーナスリアルタイム計算ツール</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap');
    body { font-family: 'Noto Sans JP', sans-serif; background-color: #f1f5f9; }
  </style>
</head>
<body class="py-8 px-4 sm:px-6 lg:px-8 max-w-4xl mx-auto">

  <!-- ヘッダー -->
  <div class="bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 rounded-2xl p-6 text-white shadow-lg mb-6">
    <div class="flex items-center space-x-3 mb-2">
      <i class="fa-solid fa-calculator text-2xl text-yellow-300"></i>
      <h1 class="text-2xl font-bold">Pococha 計算ツール</h1>
    </div>
  </div>

  <!-- メインカード -->
  <div class="bg-white rounded-2xl shadow-md p-6 border border-slate-200 space-y-6">
    
    <!-- 1. 条件設定 -->
    <div>
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">STEP 1 : 条件選択</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

        <!-- 締め時間 -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">
            <i class="fa-regular fa-clock text-indigo-500 mr-1"></i>締め時間
          </label>
          <select id="timeSelect" onchange="onConditionChange()" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm font-bold text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            <option value="24" selected>24時締め</option>
            <option value="22">22時締め</option>
            <option value="13">13時締め</option>
          </select>
        </div>

        <!-- ランク -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">
            <i class="fa-solid fa-award text-indigo-500 mr-1"></i>現在のランク
          </label>
          <select id="rankSelect" onchange="onConditionChange()" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm font-bold text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            <optgroup label="Sランク">
              <option value="S6">S6</option>
              <option value="S5">S5</option>
              <option value="S4">S4</option>
              <option value="S3">S3</option>
              <option value="S2">S2</option>
              <option value="S1">S1</option>
            </optgroup>
            <optgroup label="Aランク">
              <option value="A3">A3</option>
              <option value="A2">A2</option>
              <option value="A1">A1</option>
            </optgroup>
            <optgroup label="Bランク">
              <option value="B3">B3</option>
              <option value="B2">B2</option>
              <option value="B1" selected>B1</option>
            </optgroup>
            <optgroup label="Cランク">
              <option value="C3">C3</option>
              <option value="C2">C2</option>
              <option value="C1">C1</option>
            </optgroup>
            <optgroup label="Dランク">
              <option value="D3">D3</option>
              <option value="D2">D2</option>
              <option value="D1">D1</option>
            </optgroup>
          </select>
        </div>

        <!-- 目標ボーダー -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">
            <i class="fa-solid fa-bullseye text-indigo-500 mr-1"></i>目標ボーダー
          </label>
          <select id="borderSelect" onchange="onConditionChange()" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm font-bold text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            <option value="±0" selected>プラマイ</option>
            <option value="+1">＋１</option>
            <option value="+2">＋２</option>
          </select>
        </div>

      </div>
    </div>

    <!-- 参考実測値ミニパネル -->
    <div class="bg-slate-50 border border-slate-200 rounded-xl p-4">
      <div class="text-xs font-bold text-slate-500 mb-2 flex justify-between items-center">
        <span><i class="fa-solid fa-database text-indigo-500 mr-1"></i>ボーダー参考値</span>
      </div>
      <div class="grid grid-cols-3 gap-2 text-center">
        <div class="bg-white p-2 rounded border border-slate-200">
          <div class="text-[10px] text-slate-400">平均</div>
          <div id="refAvg" class="text-sm font-bold text-slate-700">0</div>
        </div>
        <div class="bg-white p-2 rounded border border-red-200">
          <div class="text-[10px] text-red-400">最高</div>
          <div id="refMax" class="text-sm font-bold text-red-600">0</div>
        </div>
        <div class="bg-white p-2 rounded border border-emerald-200">
          <div class="text-[10px] text-emerald-500">最低</div>
          <div id="refMin" class="text-sm font-bold text-emerald-700">0</div>
        </div>
      </div>
    </div>

    <hr class="border-slate-100">

    <!-- 2. ポイント & コアファン数入力エリア -->
    <div>
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">STEP 2 : 現在の配信状況を入力</h2>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

        <!-- 目標応援pt -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="text-xs font-bold text-slate-700">
              <i class="fa-solid fa-flag-checkered text-indigo-600 mr-1"></i>目標応援pt
            </label>
            <div class="space-x-1">
              <button onclick="applyRef('avg')" class="text-[10px] bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-1.5 py-0.5 rounded transition">平均</button>
              <button onclick="applyRef('max')" class="text-[10px] bg-red-50 hover:bg-red-100 text-red-700 px-1.5 py-0.5 rounded transition">最高</button>
            </div>
          </div>
          <div class="relative">
            <input type="number" id="targetPtInput" oninput="calculateDifference()" 
                   class="w-full text-base font-bold text-indigo-900 bg-indigo-50/40 border-2 border-indigo-200 rounded-xl py-2 pl-3 pr-8 focus:border-indigo-600 focus:outline-none">
            <span class="absolute right-2.5 top-1/2 -translate-y-1/2 text-xs font-bold text-indigo-400">pt</span>
          </div>
        </div>

        <!-- 現在の応援pt -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="text-xs font-bold text-slate-700">
              <i class="fa-solid fa-play text-emerald-600 mr-1"></i>現在の応援pt
            </label>
          </div>
          <div class="relative">
            <input type="number" id="currentPtInput" value="80000" step="1000" oninput="calculateDifference()" 
                   class="w-full text-base font-bold text-emerald-900 bg-emerald-50/40 border-2 border-emerald-300 rounded-xl py-2 pl-3 pr-8 focus:border-emerald-600 focus:outline-none">
            <span class="absolute right-2.5 top-1/2 -translate-y-1/2 text-xs font-bold text-emerald-500">pt</span>
          </div>
        </div>

        <!-- コアファン数 -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="text-xs font-bold text-slate-700">
              <i class="fa-solid fa-users text-pink-600 mr-1"></i>コアファン数
            </label>
            <span id="coreBonusBadge" class="text-[11px] font-bold text-pink-600 bg-pink-50 px-2 py-0.5 rounded-full border border-pink-200">
              ボーナス: +5% (105%)
            </span>
          </div>
          <div class="relative">
            <input type="number" id="coreCountInput" value="20" min="0" oninput="calculateDifference()" 
                   class="w-full text-base font-bold text-pink-900 bg-pink-50/40 border-2 border-pink-300 rounded-xl py-2 pl-3 pr-8 focus:border-pink-600 focus:outline-none">
            <span class="absolute right-2.5 top-1/2 -translate-y-1/2 text-xs font-bold text-pink-500">人</span>
          </div>
        </div>

      </div>
    </div>

    <!-- 3. 計算結果メイン表示カード -->
    <div id="resultCard" class="bg-gradient-to-br from-slate-900 via-indigo-950 to-purple-950 text-white rounded-2xl p-6 shadow-xl transition-all">
      <div class="text-center">
        <span id="resultSubTitle" class="text-xs font-bold uppercase tracking-wider text-indigo-300 bg-indigo-900/60 px-3 py-1 rounded-full border border-indigo-700/50">
          目標ボーダーまで あと
        </span>
        
        <!-- メイン数値（差分pt） -->
        <div class="my-3">
          <span id="diffPtDisplay" class="text-4xl sm:text-5xl font-black text-yellow-300 tracking-tight">
            0
          </span>
          <span id="diffPtUnit" class="text-lg font-bold text-indigo-200 ml-1">pt</span>
        </div>
      </div>

      <!-- アイテム換算エリア (馬車 5555 / 花火 1080) -->
      <div class="bg-white/10 backdrop-blur-md rounded-xl p-4 border border-white/10 space-y-3">
        <div class="text-xs font-bold text-indigo-200 text-center flex items-center justify-center space-x-1">
          <i class="fa-solid fa-gift text-yellow-400"></i>
          <span>必要アイテム目安</span>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-center">

          <!-- 馬車 -->
          <div class="bg-black/30 p-3.5 rounded-xl border border-amber-500/30 relative overflow-hidden">
            <div class="text-xs font-bold text-amber-300 mb-1 flex items-center justify-center space-x-1">
              <span>馬車</span>
            </div>
            <div class="my-1">
              <span id="carriageCount" class="text-2xl font-black text-yellow-300">0</span>
              <span id="carriageCountUnit" class="text-xs font-bold text-yellow-200 ml-1">個</span>
            </div>
          </div>
          
          <!-- 花火 -->
          <div class="bg-black/30 p-3.5 rounded-xl border border-pink-500/30 relative overflow-hidden">

              <span id="fireworkCountUnit" class="text-xs font-bold text-yellow-200 ml-1">個</span>
            </div>
          </div>

        </div>
      </div>
    </div>

  </div>

        "D2": { "±0": { avg: 4940,    max: 9980,    min: 2660 },   "+1": { avg: 1500,    max: 29500,   min: 8360 },    "+2": { avg: 25200,   max: 48500,   min: 14200 } },
        "D1": { "±0": { avg: 2090,    max: 4560,    min: 1040 },   "+1": { avg: 7410,    max: 14700,   min: 3700 },    "+2": { avg: 14400,   max: 28300,   min: 8080 } }
      }
    };

    let currentRefStats = { avg: 0, max: 0, min: 0 };

    // コアファン人数によるボーナス率計算 (Pococha仕様)
    function getCoreBonusRate(count) {
      if (count >= 500) return 1.22;
      if (count >= 450) return 1.21;
      if (count >= 400) return 1.20;
      if (count >= 350) return 1.19;
      if (count >= 300) return 1.20;
      if (count >= 250) return 1.19;
      if (count >= 200) return 1.18;
      if (count >= 150) return 1.17;
      if (count >= 100) return 1.16;
      if (count >= 90) return 1.15;
      if (count >= 80) return 1.14;
      if (count >= 70) return 1.13;
      if (count >= 60) return 1.12;
      if (count >= 50) return 1.11;
      if (count >= 45) return 1.10;
      if (count >= 40) return 1.09;
      if (count >= 35) return 1.08;
      if (count >= 30) return 1.07;
      if (count >= 25) return 1.06;
      if (count >= 20) return 1.05;
      if (count >= 15) return 1.04;
      if (count >= 10) return 1.03;
      if (count >= 5)  return 1.02;
      if (count >= 2)  return 1.01;
      return 1.00;
    }

    function formatPt(num) {
      return num.toLocaleString();
    }

    // 条件変更時
    function onConditionChange() {
      const time = document.getElementById('timeSelect').value;
      const rank = document.getElementById('rankSelect').value;
      const border = document.getElementById('borderSelect').value;

      currentRefStats = statsData[time]?.[rank]?.[border] || { avg: 0, max: 0, min: 0 };

      // 実測数値の表示更新
      document.getElementById('refAvg').innerText = formatPt(currentRefStats.avg) + ' pt';
      document.getElementById('refMax').innerText = formatPt(currentRefStats.max) + ' pt';
      document.getElementById('refMin').innerText = formatPt(currentRefStats.min) + ' pt';

      // 初期値として目標ptに平均値をセット
      document.getElementById('targetPtInput').value = currentRefStats.avg;

      calculateDifference();
    }

    // ワンタップで実測値を目標ptに反映
    function applyRef(type) {
      if (type === 'avg') {
        document.getElementById('targetPtInput').value = currentRefStats.avg;
      } else if (type === 'max') {
        document.getElementById('targetPtInput').value = currentRefStats.max;
      }
      calculateDifference();
    }

    // 差分計算＆表示のリアルタイム更新
    function calculateDifference() {
      const targetPt = parseInt(document.getElementById('targetPtInput').value) || 0;
      const currentPt = parseInt(document.getElementById('currentPtInput').value) || 0;
      const coreCount = parseInt(document.getElementById('coreCountInput').value) || 0;

      // コアボーナス倍率
      const bonusRate = getCoreBonusRate(coreCount);
      const bonusPercent = Math.round((bonusRate - 1) * 100);

      // コアボーナスバッジ更新
      document.getElementById('coreBonusBadge').innerText = `ボーナス: +${bonusPercent}% (${Math.round(bonusRate * 100)}%)`;

      // 必要pt
      const diffPt = targetPt - currentPt;
      // 必要コイン数
      const coin = Math.ceil(diffPt / (4 * bonusRate));

      // 未達成の場合
      if (diffPt > 0) {
        // 計算結果メイン表示カード
        document.getElementById('resultCard').className = "bg-gradient-to-br from-slate-900 via-indigo-950 to-purple-950 text-white rounded-2xl p-6 shadow-xl transition-all";
        // 目標ボーダー
        document.getElementById('resultSubTitle').innerText = "目標ボーダーまで あと";
        // 必要pt 表示
        document.getElementById('diffPtDisplay').innerText = formatPt(diffPt);
        // 必要pt 単位
        document.getElementById('diffPtUnit').style.display = "inline";
        // 馬車 必要個数
        document.getElementById('carriageCount').innerText = formatPt(Math.ceil(coin / 5555));
        // 馬車 必要個数 単位
        document.getElementById('carriageCountUnit').innerText = "個";
        // 花火 必要個数
        document.getElementById('fireworkCount').innerText = formatPt(Math.ceil(coin / 1080));
        // 花火 必要個数 単位
        document.getElementById('fireworkCountUnit').innerText = "個";
      }
      // 到達済みの場合
      else {
        // 計算結果メイン表示カード
        document.getElementById('resultCard').className = "bg-gradient-to-br from-emerald-900 via-teal-950 to-slate-950 text-white rounded-2xl p-6 shadow-xl transition-all";
        // 目標ボーダー
        document.getElementById('resultSubTitle').innerText = "目標ボーダー";
        // 必要pt 表示
        document.getElementById('diffPtDisplay').innerText = "到達中！🎉";
        // 必要pt 単位
        document.getElementById('diffPtUnit').style.display = "none";
        // 馬車 必要個数
        document.getElementById('carriageCount').innerText = "達成済み";
        // 馬車 必要個数 単位
        document.getElementById('carriageCountUnit').innerText = "";
        // 花火 必要個数
        document.getElementById('fireworkCount').innerText = "達成済み";
        // 花火 必要個数 単位
        document.getElementById('fireworkCountUnit').innerText = "";
      }
    }

    // 初回読み込み
    window.onload = function() {
      onConditionChange();
    };
  </script>
</body>
</html>
